train: 
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 4
  min_lr: 1e-05
  max_epoches: 6000
  patience: 10
  factor: 0.3
  save_freq: 1
  eval_freq: 2
  cov_weight: 0.001
  sampling: 50
  gtinit: true
  seed: 42
  pos_weight: 4.9
  vel_weight: 17.2
  decouple_cov: true
  use_pos_loss: false
  use_rot_loss: false
  rot_cov_weight: 0.0
  pos_cov_weight: 0.0055
  vel_cov_weight: 0.0014
  velnet_huber_delta: 1.0
  vel_output_scale: 10.0
  velnet_cov_init: 1.0
  vel_frame_source: gt
  vel_dir_weight: 0.0
  vel_kappa_init: 1.0
  vel_dir_min_speed: 1.0
  network: velnet
  gtrot: false
  propcov: true
  covaug: false
  att_input: none
  att_source: gt
  normalize_input: true
  correction_mode: affine
  scale_std: 0.05
  gru_hidden: 256
  mamba_dim: 128
  mamba_layers: 2
  mamba_stride: 96
  fuse: concat
  gru_window: 300
  correct_gyro: false
  aug_acc_bias_std: 
    - 0.0798
    - 0.0986
    - 0.0164
  aug_gyro_bias_std: 
    - 0.000859
    - 0.000559
    - 0.001066
  ema_decay: 0.9826
  select_smooth: 3
  eval_batch_size: 2
  metric_horizons: 
    - 6000
    - 12000
  select_metric: vel_error_60s
  loss: Huber_loss005
  pos_huber_delta: 0.6
  vel_huber_delta: 0.27