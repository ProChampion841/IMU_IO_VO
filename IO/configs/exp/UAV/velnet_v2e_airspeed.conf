# ============================================================================
# PHASE 2 / RUN E -- give the model the pitot
# ============================================================================
# ONE variable vs the baseline configs/exp/UAV/velnet_v1.conf, which this file
# includes.  Everything not overridden below is inherited, so a later edit to the
# baseline propagates here -- that is deliberate, it keeps the arms paired.
#
# exp_dir is derived from THIS file's name (train.py:774), so results land in
#   experiments/UAV/velnet_v2e_airspeed/
#
# CHANGE:   use_airspeed false -> true
# EVIDENCE: MEASURED on this corpus, 138 windows of 60 s over 12 flights, body-
#           frame forward velocity (the target's dominant axis):
#               nothing (target spread)      3.654 m/s
#               airspeed alone, best scale   1.893 m/s  -> 73.2%% of variance
#               airspeed + fitted wind       0.778 m/s  -> 95.5%% of variance
#           The model currently regresses from acc+gyro a quantity a sensor
#           on the aircraft already measures.  This is FIXED-WING specific --
#           AirIO is multirotor and has no analogue, so there is no upstream
#           precedent either way.  in_dim +1, centred at mean 22.4659 /
#           std 2.9918 so it does not enter as near-DC.
# WATCH:    expect between the 73%% and 95%% rows, not the 95%% row: the wind enters
#           body frame as (R^T W)_x, so exploiting it needs relative heading,
#           which the gyro supplies only up to an unknown offset per window.
#           Combining this with run C (attitude) may be worth more than either
#           alone -- but test them separately FIRST.
# ============================================================================
include "velnet_v1.conf"

train {
   use_airspeed: True          # +1 input channel, the one signal the IMU cannot infer
}
