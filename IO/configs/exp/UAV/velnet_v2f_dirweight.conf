# ============================================================================
# PHASE 2 / RUN F -- does the direction-uncertainty head help?
# ============================================================================
# ONE variable vs the baseline configs/exp/UAV/velnet_v1.conf, which this file
# includes.  Everything not overridden below is inherited, so a later edit to the
# baseline propagates here -- that is deliberate, it keeps the arms paired.
#
# exp_dir is derived from THIS file's name (train.py:774), so results land in
#   experiments/UAV/velnet_v2f_dirweight/
#
# CHANGE:   vel_dir_weight 0.0 -> 0.02 (builds the vMF head)
# EVIDENCE: vel_cov is DIAGONAL, so the uncertainty it can express is an axis-
#           aligned ellipsoid.  It cannot say "the speed is right, the heading
#           is not" -- and at |v| ~ 22 m/s on body x, a heading error theta
#           appears as ~|v| sin(theta) on body y, indistinguishable from real
#           sideways motion.  The vMF head scores direction separately.
#           Verified: the NLL is exact at both limits (kappa -> 0 gives
#           ln(4 pi) = 2.531, the uniform density on S^2) and the head learns
#           calibrated on a fixed batch (dir_err 46.3 -> 5.0 deg with
#           pred_sigma tracking 63.3 -> 4.1 deg).
# WATCH:    the two NEW metric.csv columns, train/val_dir_err_deg against
#           train/val_pred_dir_sigma_deg.  They should CONVERGE.  If pred_sigma
#           sits pinned near its 57 deg init, 0.02 is too small -- raise toward
#           0.1.  If it collapses toward 0 while dir_err does not, too large.
#           NOTE this run cannot resume from a baseline checkpoint: the head adds
#           33,025 parameters, so strict=True will refuse.  Train from scratch.
# ============================================================================
include "velnet_v1.conf"

train {
   vel_dir_weight: 0.02        # 0.0 in the baseline; this run is what measures it
}
