# ============================================================================
# PHASE 2 / RUN G -- cut capacity to attack the measured train/val gap
# ============================================================================
# ONE variable vs configs/exp/UAV/velnet_v1.conf, which this file includes.
# exp_dir is derived from this file's name -> experiments/UAV/velnet_v2g_smaller/
#
# CHANGE:   gru_hidden 256 -> 128
#
# EVIDENCE: the 383-epoch velnet_v1 run showed the binding constraint is
#           GENERALISATION, not optimisation:
#               train/val loss gap  x2.62 at the optimum (ep35) -> x4.43 (ep382)
#               train_loss keeps falling 1.113 -> 0.722
#               val_loss bottoms at ep35 and drifts UP to 3.195
#               60s pos gap: train 55.2 m vs val 212.3 m  = x3.84
#           Nothing else in the Phase 2 sweep attacks that. gru2 alone is 296,448
#           parameters = 37.3% of the model, the single largest block; halving
#           gru_hidden removes ~260k of 795k. Capacity is tight on this corpus:
#           ~442 NON-OVERLAPPING train windows over 11 dates against 795k
#           parameters is ~1,800 per independent sample.
#
# WATCH:    the GAP, not just the absolute number. Success is val_vel_error_60s
#           holding near 7.09 while the ratio falls well below x3.84. If val gets
#           WORSE and the gap also falls, the cut went too far -- try
#           fuse_dropout: 0.1 or weight_decay 1e-3 instead, one at a time.
#           NOTE this changes n_params but NOT n_windows, so ema_decay 0.9826 is
#           still correct and the arm stays paired with the baseline.
# ============================================================================
include "velnet_v1.conf"

train {
   gru_hidden: 128             # gru1 64->128, gru2 128->128; fuse_in 384 -> 256
}
