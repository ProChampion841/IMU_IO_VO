# ============================================================================
# RUN V3 -- LOSS (v3a) + ARCHITECTURE (v3b) together.
# ============================================================================
# exp_dir -> experiments/UAV/velnet_v3/
# Run v3a and v3b first: this arm only says whether the two stack, the single-change
# arms say which one is responsible.  See those files for the reasoning per key.
#
# 2026-10-02: two architecture changes on top of v3b.  Runs before this date are not
# comparable, and their checkpoints do not load (airspeed adds an input channel).
#   cnn_norm group -> layer   GroupNorm's statistics span the whole window, so every
#                             output depended on future frames and on the window
#                             length.  "layer" normalises each time step on its own.
#   vel_airspeed_base True    vel_body = (pitot airspeed, 0, 0) + head.  On validation
#                             ~90% of v3's error was a constant offset per 60 s window:
#                             the speed/wind level an IMU cannot observe.
#                             Replaces vel_bias_init (the airspeed is the start now).
# ============================================================================
include "velnet_v1.conf"

train {
   # loss (velnet_v3a_loss.conf)
   loss_burnin: 900
   drift_weight: 1.0
   drift_seg: 1000
   cov_nll_mode: detach
   cov_weight: 1e-2
   # architecture (velnet_v3b_arch.conf, then the 2026-10-02 changes above)
   cnn_norm: layer
   gru_context: 300
   use_airspeed: True
   vel_airspeed_base: True
}
