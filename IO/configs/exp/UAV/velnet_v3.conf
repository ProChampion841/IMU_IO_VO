# ============================================================================
# RUN V3 -- LOSS (v3a) + ARCHITECTURE (v3b) together.
# ============================================================================
# exp_dir -> experiments/UAV/velnet_v3/
# Run v3a and v3b first: this arm only says whether the two stack, the single-change
# arms say which one is responsible.  See those files for the reasoning per key.
#
# 2026-10-02: cnn_norm group -> layer.  GroupNorm's statistics span the whole window,
# so every output depended on future frames and on the window length.  "layer"
# normalises each time step on its own.  IMU only: no pitot, no GPS at run time.
# 2026-10-02: aug_mirror 0.5.  Half of the training windows are flown left-right
# mirrored (train.py:mirror_augment), so 55 flights act like 110.  Training only.
# ============================================================================
include "velnet_v1.conf"

train {
   # loss (velnet_v3a_loss.conf)
   loss_burnin: 900
   drift_weight: 1.0
   drift_seg: 1000
   cov_nll_mode: detach
   cov_weight: 1e-2
   # architecture (velnet_v3b_arch.conf, then the 2026-10-02 changes above)
   cnn_norm: layer
   gru_context: 300
   vel_bias_init: [22.0, 0.0, 0.0]
   # augmentation
   aug_mirror: 0.5
}
