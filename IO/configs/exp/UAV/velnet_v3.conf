# ============================================================================
# RUN V3 -- LOSS (v3a) + ARCHITECTURE (v3b) together.
# ============================================================================
# exp_dir -> experiments/UAV/velnet_v3/
# Run v3a and v3b first: this arm only says whether the two stack, the single-change
# arms say which one is responsible.  See those files for the reasoning per key.
# ============================================================================
include "velnet_v1.conf"

train {
   # loss (velnet_v3a_loss.conf)
   loss_burnin: 900
   drift_weight: 1.0
   drift_seg: 1000
   cov_nll_mode: detach
   cov_weight: 1e-2
   # architecture (velnet_v3b_arch.conf)
   cnn_norm: group
   gru_context: 300
   vel_bias_init: [22.0, 0.0, 0.0]
}
