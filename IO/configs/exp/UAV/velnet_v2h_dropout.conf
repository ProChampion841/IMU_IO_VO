# ============================================================================
# PHASE 2 / RUN H -- regularise the fusion point, WITHOUT cutting capacity
# ============================================================================
# ONE variable vs configs/exp/UAV/velnet_v1.conf, which this file includes.
# exp_dir is derived from this file's name -> experiments/UAV/velnet_v2h_dropout/
#
# CHANGE:   fuse_dropout 0.0 -> 0.2
#
# WHY THIS ARM EXISTS: velnet_v2g_smaller.conf's own WATCH block pre-registers it
#           -- "If val gets WORSE and the gap also falls, the cut went too far --
#           try fuse_dropout: 0.1 or weight_decay 1e-3 instead, one at a time."
#           G and H attack the SAME measured problem by opposite means: G removes
#           parameters, H keeps all 795,110 and regularises them. Run both; they
#           are not redundant, and which one wins says WHICH kind of overfitting
#           this is.
#
# EVIDENCE: the gap does not just exist, it WIDENS monotonically while train keeps
#           improving -- from experiments/UAV/velnet_v1/io_metrics.csv:
#
#               epoch   train_vel   val_vel   ratio
#                  35       3.162     7.088   2.24x   <- selected epoch
#                  40       2.889     7.233   2.50x
#                  60       2.440     7.602   3.12x
#                 100       2.418     7.771   3.21x
#                 382       2.267     7.730   3.41x
#
#           i.e. every bit of train_vel below ~3.1 was bought by making val WORSE.
#           That is the signature dropout addresses.
#
# WHY 0.2 AND NOT 0.1: the noise floor, not the theory. val_pos_error has a
#           run-to-run sd of 2.55 m, and arm C (attitude) came in at 0.23% -- far
#           inside it, i.e. unresolvable. A conservative 0.1 risks the same null.
#           0.2 is large enough to move the metric if the direction is right at
#           all; if it overshoots (val worse AND train worse), 0.1 is the retry,
#           not a refutation. Read the RATIO column above as the success criterion,
#           not the absolute number.
#
# COST:     ZERO parameters. nn.Dropout has none, so params stay at 795,110 and
#           every existing checkpoint still loads under strict=True. Dropout is
#           also train-only (model.eval() disables it), so eval/inference and the
#           tools are untouched. This is the cheapest arm in the sweep to revert:
#           delete the one key.
#
#           n_windows is unchanged, so ema_decay 0.9826 stays correct and the arm
#           remains paired with the baseline.
#
# EVALUATION IS SAFE, CHECKED: every path sets eval() before running, so no val_*,
#           eval_* or tool number ever sees dropout --
#               train.py:663 (test)          eval.py:28 (evaluate)
#               inference.py:23              tools/eval_vel_horizons.py:587
#           and 587 precedes both of its call sites (594, 609).  VERIFIED on real
#           data with identical weights: eval() output is unchanged by fuse_dropout
#           (6.1563 at 0.0 vs 6.1572 at 0.2).  With ema_decay on, the validated
#           object is the EMA copy, which build_ema() returns already in eval mode.
#
# BUT READ train_* WITH CARE.  train_loss / train_vel_error are computed INSIDE
#           train(), i.e. under network.train(), so for THIS arm alone they include
#           dropout noise.  MEASURED on identical weights:
#               dropout   train()   eval()   train-vs-eval
#                  0.0     6.0141   6.1563      -2.31%
#                  0.2     6.2096   6.1572      +0.85%
#           The -2.31% column is BatchNorm using batch statistics instead of running
#           statistics -- that is present in EVERY arm including the baseline, and is
#           not caused by dropout.  Dropout's OWN marginal effect on train_* is
#           +3.25%, which DEFLATES this arm's train/val ratio by about 3% for free.
#           Small against a ratio that spans 2.24x-3.41x, but it means the ratio is
#           not exactly comparable between H and G.  Compare arms on
#           val_vel_error_60s, which is eval-mode for all of them; use the ratio to
#           read a TREND within one run, not to rank two arms against each other.
#
# CAVEAT WORTH STATING: part of the measured gap is NOT overfitting. The
#           validation split is 3 dates (2025_11_17 x1, 2025_11_25 x3,
#           2026_04_07 x7) with NO date shared with train, and val flights cruise
#           1.87 m/s slower than train flights (6.0 train SEMs). Regularisation
#           cannot close a distribution shift. So a null result here does not mean
#           "the model is not overfitting" -- it may mean the resolvable part of
#           the gap is smaller than the sweep can see. That is a measurement
#           problem, and the fix for it is date-fold validation, not another arm.
# ============================================================================
include "velnet_v1.conf"

train {
   fuse_dropout: 0.2           # applied in Encoder.encoder(), after fuse_norm
}
