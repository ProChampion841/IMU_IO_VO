# ============================================================================
# RUN V3A -- LOSS ONLY (vs velnet_v1).  Model architecture unchanged.
# ============================================================================
# exp_dir is derived from this file's name -> experiments/UAV/velnet_v3a_loss/
#
# CHANGES (all in model/losses.py:velocity_loss, all opt-in keys):
#   loss_burnin 900       drop the first 900 frames (9 s) of each window from the
#                         OBJECTIVE.  Both branches start from h0 = 0 and the Mamba
#                         branch takes its first step 9 x 96 = 864 frames in, so these
#                         frames have almost no history.  Metrics still score every
#                         frame, so val_* stays comparable with v1.
#   drift_weight 1.0      Huber on the mean WORLD-frame velocity error of each
#   drift_seg 1000        10 s segment = that segment's displacement error / 10 s.
#                         Position drift is the integral of the error, so a steady bias
#                         matters far more than a zero-mean zig-zag; per-frame Huber
#                         cannot tell them apart.  TensorBoard: *_drift/seg_vel_bias_mps.
#   cov_nll_mode detach   the variance NLL no longer pulls on the velocity (the mean is
#   cov_weight 1e-2       trained by Huber + drift only), so its weight can go up 10x.
#                         Validation overconfidence is mostly the train/val gap, so
#                         expect better-behaved, not perfectly calibrated, variances.
# WATCH: val_vel_error_60s and val_pos_error_60s vs v1; seg_vel_bias should fall
#        faster than vel_error if the drift term is doing its job.
# ============================================================================
include "velnet_v1.conf"

train {
   loss_burnin: 900
   drift_weight: 1.0
   drift_seg: 1000
   cov_nll_mode: detach
   cov_weight: 1e-2
}
