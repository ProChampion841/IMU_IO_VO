# ============================================================================
# PHASE 2 / RUN C -- AirIO's headline: encode attitude as an input
# ============================================================================
# ONE variable vs the baseline configs/exp/UAV/velnet_v1.conf, which this file
# includes.  Everything not overridden below is inherited, so a later edit to the
# baseline propagates here -- that is deliberate, it keeps the arms paired.
#
# exp_dir is derived from THIS file's name (train.py:774), so results land in
#   experiments/UAV/velnet_v2c_attitude/
#
# CHANGE:   att_input none -> gravity, att_source -> mti
# EVIDENCE: AirIO (arXiv:2501.15659, RA-L 2025) Table III credits attitude
#           encoding with +23.8%% ATE ON TOP of the body-frame representation
#           (EuRoC 4.730 -> 3.297).  With att_input: none this model is
#           architecturally AirIO's ABLATED variant, not its headline one.
#           att_source: mti, NOT gt -- gt is the GPS-aided nav filter that also
#           produces the labels, so it would be leakage.  The MTi solution is
#           independent (median g_body error 2.0 deg, p99 8.4 deg) and the
#           feature is yaw-invariant, so the MTi's unusable heading never
#           enters.  in_dim goes 6 -> 9.
# WATCH:    NOTE a confound worth checking if this is null: normalize_input divides
#           acc per-axis by [1.999, 1.474, 4.210] (encoder.py), and the only
#           attitude signal a 6-channel model had was R^T g inside body acc.
#           Anisotropic division maps that constant-norm vector onto an
#           ellipsoid -- bijective, so a linear layer can undo it, but it
#           de-isometrises the geometry this run depends on.
# ============================================================================
include "velnet_v1.conf"

train {
   att_input: gravity          # g_body = R^-1 [0,0,1], yaw-invariant, 3 channels
   att_source: mti             # independent of the GPS that makes the labels
}
