# ============================================================================
# PHASE 2 / RUN D -- make the Mamba branch resolve time
# ============================================================================
# ONE variable vs the baseline configs/exp/UAV/velnet_v1.conf, which this file
# includes.  Everything not overridden below is inherited, so a later edit to the
# baseline propagates here -- that is deliberate, it keeps the arms paired.
#
# exp_dir is derived from THIS file's name (train.py:774), so results land in
#   experiments/UAV/velnet_v2d_stride32/
#
# CHANGE:   mamba_stride 96 -> 32
# EVIDENCE: At the 60 s window (667 tokens) stride 96 gives the branch only
#           K = 7 SSM steps for 30.4%% of the model's parameters, and its own
#           decay analysis (encoder.py) puts 1%% influence at ~7 steps -- so it
#           has reach but no RESOLUTION.  One step is 8.64 s while the GRU
#           cuts off hard at 2.97 s, leaving a 3-8.6 s band neither branch
#           resolves.  Stride 32: K = 21 steps, one step = 2.88 s (meets the
#           GRU cutoff exactly), 1%% horizon 20.2 s.  Stride 96 was tuned at
#           window 1000 / gru_window 100, a configuration this file no longer
#           runs.
# WATCH:    this is the run that decides whether the two-branch design earns its
#           parameters.  If stride 32 is also null, the branch is null -- but
#           stride 96 could never have told you that.
# ============================================================================
include "velnet_v1.conf"

train {
   mamba_stride: 32            # K = 21 steps; 1 step = 2.88 s; 1% horizon 20.2 s
}
