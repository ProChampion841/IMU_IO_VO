# ============================================================================
# RUN V3B -- ARCHITECTURE ONLY (vs velnet_v1).  Loss unchanged.
# ============================================================================
# exp_dir is derived from this file's name -> experiments/UAV/velnet_v3b_arch/
#
# CHANGES (all opt-in keys; parameter NAMES unchanged except the CNN norm):
#   cnn_norm group        GroupNorm instead of BatchNorm in the CNN tokeniser
#                         (model/cnn.py).  batch_size is 4, so BatchNorm's running stats
#                         come from 4 windows at a time and are frozen for eval, where
#                         every flight has its own sensor offsets.  GroupNorm uses
#                         per-sample statistics: identical in train and eval.
#                         NOTE: a v1 checkpoint does NOT load into this arm (the
#                         BatchNorm running buffers have no GroupNorm counterpart).
#   gru_context 300       each 300-frame GRU chunk is warmed up on the 300 frames before
#                         it (model/encoder.py:short_branch).  Before, the GRU restarted
#                         from h0 = 0 every 2.97 s and the output at each chunk start had
#                         no history at all.  Now every output sees 3-6 s.  ~2x GRU cost.
#   vel_bias_init         the velocity head starts at this body-frame velocity instead
#                         of 0, i.e. at the "always predict the mean" baseline, and
#                         learns the residual.  22 m/s forward is APPROXIMATE (|v| ~ 22
#                         m/s, almost all on body x, per velnet_v1.conf) -- replace with
#                         the measured train-set mean body velocity when available.
# WATCH: train/val gap (GroupNorm), and the error right after each 3 s chunk boundary
#        in plot_trajectory (gru_context) -- the sawtooth should be gone.
# ============================================================================
include "velnet_v1.conf"

train {
   cnn_norm: group
   gru_context: 300
   vel_bias_init: [22.0, 0.0, 0.0]
}
