# ============================================================================
# DEPRECATED 2026-09-08 -- DO NOT RUN. Kept for the record.
# ============================================================================
# This arm's premise was "velnet is under-optimised: only ~1,320 optimizer steps
# against AirIMU/AirIO's ~1e6". The 383-epoch velnet_v1 run REFUTES that:
#
#     optimum at epoch 35   = 980 optimizer steps
#     then 347 more epochs  = 9,716 further steps, with NO gain on any val metric
#     val_vel_error_60s      7.651 (ep50-100)  ->  7.737 (ep200-383)   i.e. worse
#     train/val loss gap     x2.62 (ep35)      ->  x4.43 (ep382)
#
# The model is not step-starved, it is GENERALISATION-limited. More overlap on the
# same 55 flights adds gradient steps on more-correlated windows -- it reaches the
# same optimum sooner in epoch terms and then overfits sooner. It reparameterises
# the epoch axis; it does not add information.
#
# It would also need its own ema_decay: 92 percent overlap gives ~85 steps/epoch
# instead of 28, so 0.9826 would be a 3x different smoothing horizon and the arm
# would be confounded against the baseline before it started.
#
# Superseded by velnet_v2g_smaller.conf, which attacks the gap that was actually
# measured.
# ============================================================================
# ============================================================================
# PHASE 2 / RUN B -- more gradient steps (train overlap 75%% -> 92%%)
# ============================================================================
# ONE variable vs the baseline configs/exp/UAV/velnet_v1.conf, which this file
# includes.  Everything not overridden below is inherited, so a later edit to the
# baseline propagates here -- that is deliberate, it keeps the arms paired.
#
# exp_dir is derived from THIS file's name (train.py:774), so results land in
#   experiments/UAV/velnet_v2b_step500/
#
# CHANGE:   dataset train step_size 1500 -> 500 (window unchanged at 6000)
# EVIDENCE: velnet takes ~1,320 optimizer steps total (40 epochs x 33 steps).
#           AirIMU and AirIO both reach order 1e6.  This is the single largest
#           gap to both ancestors -- velnet is under-optimised more than it is
#           over-parameterised.  ~2100 -> ~6300 train windows, 33 -> ~99
#           steps/epoch, at the SAME validation cost (metric_horizons is
#           unchanged, and validation windows are non-overlapping regardless).
#           The dataset conf itself argues this direction: "Redundant windows
#           are still optimizer steps and still vary the window's initial
#           state" (uav_6000train_4000eval.conf:45-47).
# WATCH:    train_loss should keep falling where the baseline flattened.  If the
#           4.4x train/val gap WIDENS, this is buying memorisation, not fitting --
#           then add regularisation rather than reverting the steps.
# ============================================================================
include "velnet_v1.conf"

dataset {
   # The ONLY change: the train split's step_size.  Re-including the dataset file
   # replaces the whole dataset block, which is why this is a separate conf rather
   # than a key override -- HOCON cannot patch one field of a list element.
   include "../../datasets/UAV/uav_6000train_step500.conf"
}
