   lr: 1e-3
   weight_decay: 1e-4

   batch_size: 128
   min_lr: 1e-5
   max_epoches: 100
   patience: 10
   factor: 0.1

   save_freq: 5
   eval_freq: 1
   
   cov_weight: None
   sampling: 50
   gtinit: True

   # Set 2026-09-08. Seeds python/numpy/torch (+ rank) and the train DataLoader's
   # shuffle generator. Nothing was seeded before, and val_pos_error has a run-to-run
   # sd of 2.55 m -- larger than most of the effects being A/B'd, so unseeded single
   # runs could not resolve the arms. Change it to get an independent repeat.
   seed: 42
