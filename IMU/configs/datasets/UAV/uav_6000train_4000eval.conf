test:
{
    mode: test
    calib: none
    dtype: float32
    data_list:
    [
        {name: UAV
        window_size: 4000
        step_size: 2000
        # THESE TWO KEYS ARE DEAD whenever the train config sets `metric_horizons`,
        # which both hybrid_best and velnet_v1 do.  train.py:762-763 deep-copies this
        # section and OVERWRITES both:
        #     entry["window_size"] = metric_horizons[0]
        #     entry["step_size"]  = metric_horizons[0]
        # so validation actually runs at window = step = 6000 (0% overlap), and each
        # extra horizon builds its own dataset at window = step = h.  MEASURED counts
        # under that override: 224 / 101 / 42 windows at 30 / 60 / 120 s.
        #
        # An earlier revision changed this from 800 to 2000 to cut validation cost.
        # That edit was a NO-OP -- the override was already in force.  The values are
        # left here because they apply to any config that does NOT set
        # metric_horizons; do not reason about validation cost from them.
        #
        # The TRAIN step_size is deliberately left at 1500. Cutting its overlap also
        # halves the gradient steps per epoch, and compensating with more epochs pays
        # validation again each time: 80 x (14+16) = 2400 against today's
        # 40 x (28+16) = 1760. Redundant windows are still optimizer steps and still
        # vary the window's initial state; redundant VALIDATION windows are not.
        data_root: /home/master/DATA/corvo_log_real_data/
        data_drive: [2025_11_17_141_12_sensor_data.csv, 2025_11_25_135_4_sensor_data.csv, 2025_11_25_137_5_sensor_data.csv, 2025_11_25_137_6_sensor_data.csv, 2026_04_07_153_67_sensor_data.csv, 2026_04_07_154_48_sensor_data.csv, 2026_04_07_156_63_sensor_data.csv, 2026_04_07_178_46_sensor_data.csv, 2026_04_07_178_47_sensor_data.csv, 2026_04_07_219_54_sensor_data.csv, 2026_04_07_219_55_sensor_data.csv, valid1.csv]
        },
    ]
    gravity: 9.81007
}

