# The `inference` section is the one inference.py, evaluation/evaluate_state.py
# and tools/eval_horizons.py all read -- evaluate_state.py hard-codes
# config.inference and eval_horizons.py defaults --section to it.  Without this
# block those three tools raise on this dataconf.
#
# It lists the 12 genuinely HELD-OUT test flights (dates 2025_11_06 and
# 2026_02_06), copied verbatim from uav_4000.conf so the two files agree.
# 2026_02_06_160_22 is REMOVED here (uav_4000.conf still lists it): 13.95 s recording
# gap, GT velocity implies 491 m/s^2, and it swamps every aggregate it enters.
# 11 flights remain, all long enough for a 40 s window.
