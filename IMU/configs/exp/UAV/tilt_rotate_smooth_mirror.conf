# tilt_rotate_smooth_mirror -- tilt_rotate_smooth + ONE change: mirror flights.
#
# WHY.  Too little data: ~440 independent training windows, and the model memorises
# them (tilt_rotate: train 0.79 of raw vs val 0.91 at 60 s).  A fixed-wing flight
# flipped left <-> right is still a physically valid flight, so each training window
# is flown mirrored with probability 0.5 -- about twice the distinct training data.
#
# HOW (train.py, mirror_augment).  M = diag(1, -1, 1):
#   acc, pos, vel -> ( x, -y,  z)     gyro -> (-x, y, -z)
#   attitude R -> M R M  (quaternion x, z flip sign)
# The integrator commutes with this exactly, so labels stay consistent
# (checked in tests/test_model_updates.py).  Training split only; val, test, eval,
# ONNX and the drone are unchanged.  Uses GPSNavEul like tilt_rotate_smooth.
#
# WIN = beats tilt_rotate_smooth on the held-out flights, and the train/val gap
# shrinks.  If held-out gets worse (aircraft asymmetry, e.g. propeller), try 0.25.

include "tilt_rotate_smooth.conf"

train:
{
   aug_mirror_prob: 0.5
}
