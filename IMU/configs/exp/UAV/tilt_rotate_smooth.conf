# tilt_rotate_smooth -- tilt_rotate + ONE new loss term: the tilt correction must
# change slowly.
#
# WHY.  correction_mode: rotate emits a small rotation dtheta every 90 ms, and
# nothing in tilt_rotate's objective limits how fast it changes.  The error it
# removes -- the tilt error of the attitude handed to the integrator -- changes over
# tens of seconds.  The spare freedom goes into memorising the training flights:
# tilt_rotate (logs of 2026-10-02, 323 epochs) reached 0.79 of raw on train but
# 0.93 / 0.91 / 0.88 at 30 / 60 / 120 s on val.
#
# THE TERM (model/losses.py, `dtheta_smooth_weight`):
#     loss += w * mean over steps of |dtheta[k+1] - dtheta[k]|^2    (deg^2, 90 ms steps)
# w = 0.1: a jumpy 0.3 deg per step costs ~10% of the train loss; a slow drift costs
# ~nothing.  dtheta is 0 at init, so the term starts at 0.
#
# EVERYTHING ELSE IS tilt_rotate, seed included, so the comparison measures the term.
# Watch `dtheta_step_rms_deg` in TensorBoard (and the "tilt correction step" console
# line): it should fall well below tilt_rotate's.
#
# WIN = beats tilt_rotate's val 0.931 / 0.909 / 0.879 (30 / 60 / 120 s, mean of the
# last 30 epochs) AND a smaller train/val gap.  Then score both on --splits inference.
# If val gets worse, halve the weight (0.03); if the gap is still wide, raise it (0.3).

include "tilt_rotate.conf"

train:
{
   dtheta_smooth_weight: 0.1
}
