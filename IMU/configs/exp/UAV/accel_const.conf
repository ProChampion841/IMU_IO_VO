# accel_const -- THE REDUCED ARM
#
# WHY THIS EXISTS.  hybrid_best has now peaked inside 5 epochs and then memorised,
# TWICE, on two different architectures:
#     gtrot False : best 0.987x at epoch 2, 1.154x by epoch 71
#     gtrot True  : best 0.979x at epoch 4, 1.065x by epoch 23
# Both times train error kept falling while validation rose, and both times the LR
# cut made it worse rather than better.  928,242 parameters against ~442 INDEPENDENT
# training windows is 2,100 parameters per independent sample.  That is the diagnosis.
#
# WHAT THE ORACLE SAYS IS ACTUALLY THERE.  Velocity is EXACTLY linear in a constant
# accel bias, so the ceiling is computable, not guessable.  With NavEul attitude and
# the 15 s freeze already applied, the best possible CONSTANT bias per window:
#
#     horizon   as-is    with perfect constant b   removed   implied |b|
#      30 s    2.94 m/s        1.21 m/s              59%     0.1037 m/s^2
#      60 s    4.28            1.62                  62%     0.0941
#     120 s    5.57            3.01                  46%     0.0939
#
# |b| is stable across horizons, so this is a real roughly-constant bias and a
# well-posed target.  hybrid_best captured about 2% of it before overfitting.
#
# SO THIS ARM CHANGES TWO THINGS AND NOTHING ELSE:
#
# 1. const_correction: True     predict ONE 3-vector, not a per-frame signal.
#    Implemented as a CAUSAL cumulative mean of the encoder features (model/hybrid.py
#    _correct), so the estimate refines as data arrives and converges to a constant.
#    A global mean would have been non-causal and would have broken the nested
#    prefix property that tools/eval_vel_horizons.py --nested depends on.
#
# 2. correction_mode: additive  the oracle is a pure additive bias, so the
#    multiplicative scale head is dropped.  One fewer thing to fit.
#
# ...and shrinks the network to match the sample count.  If this arm ALSO peaks in
# under 5 epochs, capacity was not the problem and the per-window bias is simply not
# predictable from the IMU on this corpus -- which would be consistent with the
# standing measurement that one flight's bias applied to another is 1.34x WORSE than
# nothing and a 74-flight corpus mean buys only 5%.  That is a real result either way.

general:
{
   exp_dir: experiments/UAV
}

dataset:
{
   include "../../datasets/UAV/uav_6000train_4000eval.conf"
   collate: padding9
   train: { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   eval:  { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   test:  { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   # dtype float32 overrides the dataconf's float64 for this section: the network is
   # built .float() and a float64 batch dies in the CNN with 'Input type (double) and
   # bias type (float) should be the same'.  Matching test/eval also makes a held-out
   # number directly comparable with the selection-set number.
   inference: { freeze_hist_s: 15.0, freeze_k_sub: 10, dtype: float32 }
}

train:
{
   include "../../train/train.conf"

   # ---- everything below this line is IDENTICAL to hybrid_best ----------------
   lr: 1e-3
   batch_size: 64
   max_epoches: 200
   patience: 12
   factor: 0.3
   min_lr: 1e-7
   save_freq: 5
   pos_weight: 4.9
   vel_weight: 17.2
   cov_weight: 1e-4
   decouple_cov: True
   use_pos_loss: False
   use_rot_loss: False
   rot_cov_weight: 0.0
   pos_cov_weight: 5.5e-3
   vel_cov_weight: 1.4e-3
   network: hybridnet
   gtrot: True                 # NavEul attitude, same as hybrid_best
   propcov: True
   covaug: False
   att_input: none
   att_source: mti
   normalize_input: True
   correct_gyro: False
   use_airspeed: False
   air_weight: 0.0
   aug_acc_bias_std: [0.0798, 0.0986, 0.0164]
   aug_gyro_bias_std: [0.000859, 0.000559, 0.001066]
   select_smooth: 3
   eval_batch_size: 64
   metric_horizons: [6000, 3000, 12000]
   select_metric: pos_error_60s
   eval_freq: 10
   sampling: 50
   cov_sampling: 250
   loss: Huber_loss005
   pos_huber_delta: 0.6
   vel_huber_delta: 0.27
   gru_window: 300
   mamba_stride: 32
   fuse: concat

   # ---- THE TWO CHANGES ------------------------------------------------------
   const_correction: True      # one causal 3-vector per window, see header
   correction_mode: additive   # the oracle is additive; drop the scale head

   # ---- CAPACITY, sized to ~442 independent windows ---------------------------
   # hybrid_best: 928,242 params = 2,100 per independent window.
   # Here: gru_hidden 256->64, mamba_dim 128->32, mamba_layers 2->1,
   #       head_hidden 128->32, cnn_dim 64->32.
   # ema_decay is unchanged at 0.982 (28 steps/epoch, ~2 epochs) since batch_size
   # is unchanged; recompute as 1 - batch_size/(2*1769) if you change it.
   gru_hidden: 64
   mamba_dim: 32
   mamba_layers: 1
   head_hidden: 32
   cnn_dim: 32
   fuse_dim: 64
   ema_decay: 0.982
}
