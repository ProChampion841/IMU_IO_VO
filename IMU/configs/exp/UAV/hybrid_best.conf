# hybrid_best -- THE ONE HYBRID CONFIG TO RUN
#
# Replaces hybrid_v13_residual for new runs. v13 stays only because it is the config
# that produced experiments/UAV/hybrid_v13_residual/ckpt -- do not train it again.
#
# Four changes from v13. THREE ARE MEASURED, ONE IS A BET, and the difference matters:
#
# 1. cov_sampling: 250          MEASURED, FREE
#    `sampling` set two unrelated things: how finely the loss scores the trajectory
#    and how many times pypose is called. On the trained v13 checkpoint (B=8,
#    W=6000, RTX 4070) integrate() was 3345 ms of a 4255 ms forward -- 78.6% --
#    against 8.1 ms for the ENTIRE network. Decoupled: pos/vel/rot move by 3-7e-6
#    RELATIVE (float32 accumulation order), the reported state metrics by 0.0002%
#    (pos 636.1329 -> 636.1342 m). Only the uncertainty head's supervision density
#    changes, 120 -> 24 checkpoints per window (still 1536 per step at batch 64).
#
# 2. mamba_stride: 96 -> 32     BOTH BRANCHES KEPT, THE LONG ONE RETUNED
#    Two operators at two time scales is the design intent and it is retained:
#    the GRU carries short context, the Mamba carries long. What was wrong in v13
#    was not that the long branch existed -- it was that its stride made it useless
#    at the job.
#
#    AT STRIDE 96 the branch took ceil(668/96) = SEVEN SSM steps over a 60 s window,
#    so it emitted a 7-plateau staircase. Its FIRST plateau spanned 8.64 s -- 14% of
#    a 60 s window, 22% of a 40 s eval window -- and depended on CNN token 0 ALONE,
#    whose 13-frame support is 9 synthetic padding9 frames plus 4 real samples.
#    MEASURED: blanking every input past padded frame 300 changed that plateau by
#    exactly 0.000e+00. A "long context" branch that reads 40 ms of data for the
#    first 8.6 s of every window is not carrying long context.
#
#    AT STRIDE 32 it takes 21 steps. MEASURED cost and reach at window 6000:
#
#        stride   K    1% horizon   fwd+bwd    first plateau
#           96    7       60.5 s     20.3 ms       8.64 s   <- v13
#           48   14       30.2 s     28.9 ms       4.32 s
#           32   21       20.2 s     41.6 ms       2.88 s   <- chosen
#           16   42       10.1 s     75.9 ms       1.44 s
#            8   84        5.0 s    133.8 ms       0.72 s
#
#    WHY 32 AND NOT 48 OR 16. The GRU has a HARD 2.97 s cutoff (gru_window 300
#    frames, h0 = 0 at every chunk start -- a cutoff, not a decay). Stride 32 puts
#    the Mamba's first plateau at 2.88 s, so the long branch takes over exactly
#    where the short one stops. Stride 48 puts it at 4.32 s and leaves a 1.35 s band
#    that NEITHER branch resolves; stride 16 reaches only 10.1 s, barely 3x the GRU,
#    which is not a separation of time scales. At 32 the reach is 20.2 s -- 7x the
#    GRU -- with 21 steps of resolution instead of 7.
#
#    COST: 41.6 ms, about 4% of the step once cov_sampling is set. It was 26% of the
#    parameters for a 7-step staircase before; it is now 26% for a working operator.
#
#    KNOW WHAT THE STANDING MEASUREMENTS SAY, so a null is not a surprise. The job
#    this branch is for -- infer which flight and how big today's bias is -- reads
#    closed on this corpus: cross-flight bias transfer is 1.34x WORSE than nothing,
#    a 74-flight corpus mean buys 5%, and the Stage A module found no per-flight
#    structure (per-flight cosine 0.171 vs corpus-mean 0.993). Capacity is also
#    tight: ~442 NON-OVERLAPPING train windows over 11 dates against 928k
#    parameters is 2,100 per independent sample, and velnet showed a 4.4x train/val
#    gap here. If this arm comes back null, stride was not the reason -- but stride
#    96 would have made it impossible to tell.
#
# 3. select_metric: pos_error_60s   MEASURED, FREE
#    velnet_v1 selected on the objective and shipped epoch 17; val_pos_error_120s was
#    best at epoch 5 and val_pos_error_60s at epoch 8. The objective and the reported
#    metric do not bottom out together, and at save_freq 100 the better weights were
#    unrecoverable. Select on what is read.
#    2026-09-07: the horizon is 60 s, not 120 s. Window counts were MEASURED at the
#    sizes metric_horizons actually forces -- 224 / 101 / 42 at 30 / 60 / 120 s -- and
#    the 120 s column has 42 windows over 10 of 11 flights with one flight carrying
#    26% of them. See the select_metric block below.
#
# 4. use_airspeed: False        REMOVED FROM THE INPUT 2026-09-07, at the user's
#                               request.  History kept because the reasoning below
#                               is still the record of what was measured.
#    Everything above makes the model cheaper and smaller. NONE of it makes it more
#    accurate, and it would be dishonest to imply otherwise: v13 is null against the
#    freeze, and the reason is structural. MEASURED on 10 eval flights by substituting
#    perfect attitude into the same integration:
#
#        horizon   freeze     v13    freeze+GTrot   attitude share of squared error
#         30 s      61.8 m    58.8      34.9 m              68.2%
#         60 s     274.7     273.6     106.9                84.9%
#        120 s    1480.1    1479.0     357.7                94.2%
#
#    At 120 s, 94% of the drift is ATTITUDE, and correct_gyro: False means this model
#    cannot touch it. It optimises the remaining ~6%, most of which the 15 s
#    pre-handover freeze already took. That is the ceiling, and no architecture change
#    lifts it.
#
#    The pitot is the one channel that carries information the IMU does not, and it
#    is genuinely more accurate than the integration: MEASURED with NavEul attitude
#    and the correction at identity, integrated velocity error vs airspeed
#    disagreement was 2.94/1.17, 4.28/1.49, 5.57/1.97 m/s at 30/60/120 s -- the pitot
#    knows forward speed 2.5-2.9x better.
#
#    IT IS STILL OFF.  `use_airspeed: False` removes it from the encoder input
#    (in_dim 7 -> 6) and `air_weight: 0.0` keeps it out of the loss, so airspeed
#    reaches the model NOWHERE.  The dataloader still emits the channel, so turning
#    either back on is a one-line change and needs no data work.
#
# WHY correct_gyro STAYS FALSE. Enabling it is the only way to reach the 94%, and it
# is measured closed: v11's gyro correction scored 0.924x on raw against the freeze's
# 0.758x, time-variation in the gyro correction is worth 5.4% on position, and both
# position-optimal gyro oracles BROKE attitude (the counter-drift trap). Turning it on
# here would be a second bet stacked on the first.
#
# PRE-REGISTERED BAR: fnet/freeze < 1.0 on val at BOTH 60 and 120 s with no date above
# 1.0 -- the same bar v13 was held to, which v13 passes on TEST and fails on eval.
# Compare on identical windows with tools/eval_vel_horizons.py --nested.
#
# COST: ~1.0 s/step against v13's 4.77 s, so a 40-epoch run is roughly a fifth of the
# wall clock.

general:
{
   exp_dir: experiments/UAV
}

dataset:
{
   include "../../datasets/UAV/uav_6000train_4000eval.conf"
   collate: padding9
   # Pre-handover bias freeze, applied by datasets/dataset.py at construction.
   # MUST match the evaluator's --hist 15 --k_sub 10 or the arms are not comparable.
   train: { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   eval:  { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   test:  { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   # inference builds ONE whole-flight window; the loader shifts its start to H
   # so the calibration interval exists.  WITHOUT this key inference would feed
   # RAW imu to a model trained on freeze-corrected input -- off-distribution.
   # dtype float32 overrides the dataconf's float64 for this section: the network is
   # built .float() and a float64 batch dies in the CNN.  Without this line
   # `--splits inference` -- the only genuinely held-out flights -- cannot be run.
   inference: { freeze_hist_s: 15.0, freeze_k_sub: 10, dtype: float32 }
}

train:
{
   include "../../train/train.conf"
   lr: 1e-3
   batch_size: 64            # window is 6x longer than v10's; the integrator loop is ~constant in batch, so pay for the window with batch# back to v10's value: the window is 10 s again, so the integrator loop is cheap# window is 12x longer than v10; step time is dominated by the integrator's Python loop, which is ~constant in batch
   # 10000 epochs, and train.py has NO early stopping -- `patience`/`factor`/`min_lr`
   # below are ReduceLROnPlateau, which lowers the learning rate but never halts the
   # loop, so the run stops only at max_epoches or when you kill it.  save_freq 1 means
   # every epoch is checkpointed, so --load_ckpt resumes cleanly after a kill.
   #
   # BUT KNOW WHAT 10000 EPOCHS ACTUALLY BUYS.  With lr 1e-3, factor 0.3 and min_lr
   # 1e-5, only FOUR plateau cuts fit between them (0.3^4 = 8.1e-3), so the schedule
   # floors at 1e-5 early and every remaining epoch runs at the floor.  If the point of
   # the long run is continued learning rather than a long random walk at min_lr, lower
   # min_lr (1e-7) or raise patience; otherwise expect a very long plateau.
   # Runtime at 4.74 s/step, 33 steps/epoch (2100 windows / batch 64): ~156 s per
   # epoch of training plus two validation horizons -- order 3 weeks for 10000.
   # ---- BUDGET, sized from the MEASURED epoch cost ----------------------------
   # 1769 train windows / batch 64 = 28 optimizer steps per epoch. Measured step time
   # is 687 ms at batch 64, so a training epoch is ~19 s and a full epoch (validation
   # is 24% of it after the val step_size 2000 change) is ~25 s. 200 epochs is
   # therefore ~85 minutes -- not the 3 weeks the old comment feared, because
   # integrate() went from 3345 ms per step to ~200 ms.
   #
   # There is NO early stopping in train.py: the run ends at max_epoches or when you
   # kill it. best_model.ckpt and newest.ckpt are written every epoch regardless, and
   # selection is the 3-epoch smoothed val_pos_error_120s, so a long tail costs wall
   # clock but cannot select a worse checkpoint.
   max_epoches: 2000
   # patience is in EPOCHS, and an epoch is only 28 optimizer steps here -- 6 epochs
   # is 168 steps, a very short look before cutting the LR. 12 epochs = 336 steps.
   patience: 12
   factor: 0.3                 # v8 used 0.1; 10x cuts floored the schedule by epoch 45
   # min_lr 1e-5 admitted only THREE cuts from lr 1e-3 at factor 0.3
   # (1e-3 -> 3e-4 -> 9e-5 -> 2.7e-5 -> floor), so the schedule could bottom out by
   # epoch ~24 and every epoch after ran at the floor -- hybrid_v8 spent 59% of its
   # epochs there. 1e-7 admits SEVEN cuts, which is what makes a 200-epoch budget
   # worth having rather than a long random walk at the floor.
   min_lr: 1e-7
   # save_freq 5.  train.py writes ckpt/%%04d.ckpt every save_freq epochs and NEVER
   # prunes them; a checkpoint here is ~14 MB.  At 200 epochs that is 40 files,
   # ~560 MB -- fine on this disk, and it is the archive that matters: velnet_v1's
   # best val_pos_error_120s was epoch 5 and was UNRECOVERABLE at save_freq 100, and
   # hybrid_best's own best epoch (2) was already gone at save_freq 25.  A 5-epoch
   # grid would have caught it.  best_model.ckpt (selection) and newest.ckpt
   # (--load_ckpt resume) are written EVERY epoch regardless; the numbered files are
   # a browsable archive on top of those.
   save_freq: 1

   pos_weight: 4.9
   vel_weight: 17.2

   cov_weight: 1e-4            # MUST be set: train.conf gives it the STRING "None"
   decouple_cov: True

   # ---- ROTATION IS FULLY OUT OF THE OBJECTIVE --------------------------------
   # use_rot_loss False drops the rotation STATE term (rot_dist is built under
   # no_grad, so it contributes no graph node at all).  rot_cov_weight 0 now also
   # SKIPS the rotation covariance NLL rather than multiplying it by zero.
   # VERIFIED: d(loss)/d(cov) on the rotation block is exactly 0.000000e+00 while
   # the vel+pos blocks stay at 1.13e+01.  No rotation quantity enters the graph.
   #
   # It was not inert before: zeroing it moved accdecoder |grad| by 1.54%,
   # accscale_decoder by 3.43% and cnn by 3.18%, because the covariance head shares
   # the trunk with the correction heads.
   #
   # THE COST, so it is not a surprise later: cov_r was the only term directly
   # supervising gyro_cov.  gyro_cov still reaches the vel/pos covariance blocks
   # through the B_g propagation term, so it stays indirectly supervised -- but if
   # pred_cov_vel / pred_cov_pos calibration degrades, this is the cause.
   # ---- POSITION STATE TERM REMOVED (2026-09-04, at the user's request) --------
   # These logs carry NO measured position.  datasets/UAVdataset.py builds
   # gt_translation as the cumulative trapezoidal integral of the GPS velocity, so
   # with the integrator starting from the same initial state
   #     pos_dist(t) = int_0^t (v_pred - v_gt) dtau
   # i.e. the position residual IS the integral of the velocity residual, and the
   # position term was never independent supervision -- pos_weight and vel_weight
   # were weighting one residual against its own integral.
   #
   # WHAT THIS GIVES UP, on the record: a CONSTANT velocity bias b makes pos_dist
   # grow as b*t while vel_dist stays flat at b, so the position term was the one
   # disproportionately punishing sustained bias -- and a per-flight turn-on bias is
   # the dominant 40 s error mode measured on this corpus.  Expect val_pos_error to
   # respond differently; watch it against the raw baseline, not against v9/v10 runs.
   #
   # pos / pos_rel are STILL reported as metrics (the residual is built under
   # no_grad), and the position covariance NLL is untouched -- it is controlled
   # separately by pos_cov_weight, and decouple_cov is True here so pos_weight does
   # not silently become a covariance-only knob.
   use_pos_loss: False
   use_rot_loss: False
   rot_cov_weight: 0.0

   # ---- COVARIANCE vs STATE BALANCE -------------------------------------------
   # MEASURED at init on 32 val windows: with the old weights the covariance NLL was
   # 66.8% of the objective and the pos/vel state terms only 33.2%, i.e. the
   # correction heads -- the thing being optimised for accuracy -- received a third
   # of the gradient.  Rescaling both covariance weights by 0.1655 puts state at 75%
   # and covariance at 25%, which still trains the uncertainty head properly.
   # This is an INIT-time ratio: the NLL falls as the covariance calibrates, so the
   # state share rises during training.  Watch pred_cov_pos in TensorBoard -- if it
   # stops moving, these are too small.
   pos_cov_weight: 5.5e-3      # was 3.3e-2
   vel_cov_weight: 1.4e-3      # was 8.5e-3

   network: hybridnet
   # ---- ATTITUDE COMES FROM THE MTi NAV SOLUTION (2026-09-07) -----------------
   # gtrot True feeds data['rot'] (built from GPSNavEulX/Y/Z) straight into the
   # integrator instead of integrating the gyro.  This is NOT leakage and NOT an
   # oracle: the MTi ARCH3 publishes this attitude at runtime, and it survives a GPS
   # outage.  MEASURED, on raw CSV, that its yaw is not GPS-derived -- NavEul yaw vs
   # GPS course-over-ground differs by std 14.5-18.3 deg across flights, which IS the
   # crab angle from wind.  A GPS-course-derived yaw would track course within ~1 deg.
   # It holds true heading instead, so it does not depend on GPS.
   #
   # WHAT THIS BUYS, measured on the eval split, endpoint velocity error:
   #     horizon   gyro-integrated   NavEul
   #      30 s        5.32 m/s        2.93     1.8x
   #      60 s       12.04            4.25     2.8x
   #     120 s       27.19            5.54     4.9x
   #
   # AND IT COLLAPSES THE REST OF THE PROBLEM.  Attitude was 94% of the 120 s error;
   # with it supplied, the accel path is no longer optimising 6% of the budget.  The
   # gyro head stays off (correct_gyro False) because the gyro no longer sets
   # attitude, rotation stays out of the loss (use_rot_loss False), and airspeed is
   # out of BOTH the input (use_airspeed False) and the loss (air_weight 0.0).
   gtrot: True
   propcov: True               # <-- the uncertainty covariance you asked for
   covaug: False

   # --- HybridNet ---------------------------------------------------------
   att_input: none        # IMU-ONLY: the control (freeze) has no MTi either
                               # deterministic functions of these, and sin_p = -gx
                               # EXACTLY (model/attitude.py:129), so they add zero
                               # information and break per-channel input scaling.
   att_source: mti             # honest and runtime-available.  gt = GPS = leakage.
   normalize_input: True       # divide each input channel by its corpus std before
                               # the first Conv1d.  MEASURED: without it acc is
                               # 98.93% of input variance, gyro 0.474%, att 0.591%
                               # (acc:gyro ratio 208.6:1), so the gyro and attitude
                               # channels are effectively invisible to the encoder.
                               # Same bug short_norm already fixes one layer later.
   correction_mode: affine     # <-- emits a CORRECTION, identity at init
   scale_std: 0.05             # +-0.49 m/s^2 along gravity, ~10x the observed spread
   gru_hidden: 256             # kept at v8's value -- see CHANGE 4
   mamba_dim: 128              # kept at v8's value
   mamba_layers: 2
   # mamba_stride is set ONCE, at the bottom of this block, to 32.
   # The v13 value (96) and its stale trailing comments are removed rather
   # than left to be overridden: HOCON is last-wins, so two lines setting one
   # key resolves correctly but reads as a contradiction.
                               # MEASURED (tools/hybrid_receptive_field.py) at window 1000,
                               # gru_window 100.  stride is the horizon/step-count lever:
                               #   stride  K   Mamba 1%   separation vs GRU (1/e)
                               #      4    29    2.52 s        1.0x  <- no separation
                               #      6    19    3.78 s        1.5x
                               #      8    15    5.04 s        2.0x  <- chosen
                               #     12    10    7.56 s        3.0x  <- K getting thin
                               # stride 2 (K=57) was tried first and is WRONG here: it puts
                               # the Mamba 1/e at 0.18 s against the GRU's 0.45 s, i.e. the
                               # long-term branch ends up SHORTER than the short-term one.
                               # docs' "set mamba_stride 2 at window 1000" recovers the SSM
                               # step COUNT, not the context LENGTH -- it says so explicitly.
   fuse: concat
   gru_window: 300           # 33 tok = 297 frames = 2.97 s HARD cutoff (h0 = 0 per chunk)# 33 tok = 297 frames = 2.97 s HARD cutoff (h0 = 0 per chunk)# 33 tok = 297 frames = 2.97 s HARD cutoff -- the short path# 11 tokens = 0.99 s hard cutoff -- genuinely short-term
   correct_gyro: False         # unchanged from v9_acconly: one variable at a time

   # ---- BIAS AUGMENTATION -- THE ONE DIFFERENCE FROM hybrid_v9_acconly ------
   # A fresh constant bias per window, redrawn on every draw.  Training split
   # only; val and eval always see the clean signal.  0.0 is an exact no-op.
   # PER AXIS, set at the measured per-window spread.  A scalar is also accepted
   # (isotropic), but the spread is anisotropic and a scalar at the x/y level would
   # over-augment accel z by ~5x, making that axis a harder problem than the real one.
   aug_acc_bias_std: [0.0798, 0.0986, 0.0164]        # m/s^2
   # rad/s, = [0.0492, 0.0320, 0.0611] deg/s.  INERT while correct_gyro is False:
   # train.py skips gyro augmentation when the network has no gyro head.
   aug_gyro_bias_std: [0.000859, 0.000559, 0.001066]

   # ---- EMA + SMOOTHED SELECTION (see header) ---------------------------------
   # ---- EMA TIME CONSTANT, CORRECTED ------------------------------------------
   # ema_decay 0.998 has a time constant of 1/(1-d) = 500 steps. The old comment
   # called that "~2 epochs", which was true at 255 steps/epoch (32,610 windows /
   # batch 128) -- a dataset this repo no longer has. At today's 28 steps/epoch it is
   # 17.9 EPOCHS: nine times too long.
   #
   # WHAT THAT DID. The EMA is seeded from the live weights at construction, so after
   # n steps it still carries d^n of the INITIALISATION. hybrid_v13's selected epoch
   # was 13 = ~392 steps, and 0.998^392 = 0.46 -- roughly HALF of the checkpoint that
   # every downstream tool loaded was the random init, because model_state_dict IS
   # the EMA copy and val_*/eval_* describe it. That alone could make an arm read
   # null.
   #
   # 0.982 gives 1/(1-0.982) = 56 steps = 2.0 epochs, which is what was intended:
   # enough to average out the epoch-to-epoch saw-tooth (measured sd 2.55 m, lag-1
   # autocorrelation -0.49) without lagging the run.
   # IF YOU CHANGE batch_size, RECOMPUTE: ema_decay = 1 - batch_size / (2 * 1769).
   ema_decay: 0.982
   select_smooth: 3            # best_model.ckpt on the 3-epoch mean; none before epoch 2

   eval_batch_size: 64

   # metric.csv columns are built from this list (FRAMES, 100 Hz).  The FIRST
   # entry is the PRIMARY horizon: it overrides the validation window, its loss
   # becomes val_loss, and checkpoint selection reads it -- so it is set equal to
   # the TRAIN window, which makes train_* and the first val_* pair directly
   # comparable.  Every extra horizon costs one more validation pass per epoch,
   # ~H/H0 times the primary one (the integrator loop is linear in window).
   # Flights too short for a horizon yield no window there, so a long column
   # quietly uses FEWER flights -- train.py prints the window count per horizon
   # at startup; check it before trusting the long column.
   # 3000 ADDED: the reported metrics (tools/eval_vel_horizons.py) are read at
   # 30 s / 60 s / 120 s, so the validation columns now cover the SAME three
   # horizons.  Cost is one extra pass at 0.5x the primary -- the cheapest of the
   # three.  The FIRST entry is still 6000 and still the primary: it overrides the
   # validation window_size AND step_size (train.py:762-763), so it must stay equal
   # to the train window for train_* and the first val_* to be comparable.
   metric_horizons: [6000, 3000, 12000]   # 60 s primary, plus 30 s and 120 s
   # evaluate() feeds only the eval_* CSV columns and the TensorBoard eval/* group
   # -- and csv_fields() does not EMIT eval_* columns when metric_horizons is set,
   # which it is here.  So the pass survives only as TensorBoard scalars, computed on
   # rank 0 while every other rank waits at the barrier.  10 instead of 2 keeps a
   # periodic signal at a fifth of the cost.
   eval_freq: 10

   sampling: 50                # 0.5 s spacing: 20 checkpoints when training
                               # (10 s windows), 80 when validating (40 s)
   loss: Huber_loss005

   # ---- HUBER KNEE, SET AT THE MEASURED MEDIAN RESIDUAL -----------------------
   # Huber_loss005 is delta = 0.005, which sits ~120x BELOW the median residual, so
   # 99.9% of elements are in the linear regime and the objective is really L1.
   # Verified: 0.005 * mean|pos_dist| = 0.00977943 vs actual pos_loss 0.00976699.
   #
   # Because windows are GT-initialised, pos_dist[:,k] IS the drift over (k+1)*0.5 s,
   # so every horizon 0.5..10 s is already supervised -- and under L1 each of the 20
   # checkpoints gets EXACTLY 5.00% of the gradient.  That spends half the gradient
   # on 0-5 s where the mean residual is 0.019-1.0 m and half on 5-10 s where it is
   # 1.5-4.0 m: uniform weighting across a 205x range of error magnitudes.
   #
   # Setting delta at each channel's MEASURED MEDIAN (pos 0.590 m, vel 0.268 m/s over
   # 256 val windows) makes half the residuals quadratic -- so larger errors pull
   # harder -- and leaves half linear, so the p99 windows (pos 11.96 m) cannot
   # dominate.  Gradient share on the second half of the window:
   #     delta   0.005(L1)  0.05   0.25   0.6    1.0    2.0    L2
   #     pos       50.5%   54.0%  60.6%  65.0%  70.4%  77.0%  87.1%
   #     vel       50.2%   52.0%  57.9%  62.9%  69.5%  74.3%  75.6%
   #
   # The implementation divides by delta/0.005 so the LINEAR-REGIME SLOPE IS
   # UNCHANGED.  Without that, delta 0.6 multiplies every gradient by ~86x (measured)
   # and silently invalidates lr, pos_weight, vel_weight and weight_decay at once.
   # So these keys change the loss SHAPE only; lr 1e-3 stays valid.
   pos_huber_delta: 0.6
   vel_huber_delta: 0.27

   # rel_weight puts the INCREMENTAL (0.5 s) error into the OBJECTIVE, not just the
   # metric -- the direct fix for the counter-drift v8 learned.  Left at the 0.0
   # default here so hybrid_v9 changes the architecture story only; turn it on as a
   # separate experiment once v9 has a number, or the two effects cannot be told apart.
   #
   # SCALE, measured on a real batch of this config: the relative term enters as
   # rel_weight * (pos_weight * pos_rel + vel_weight * vel_rel).  At init that is
   # 4.9*0.527 + 17.2*0.138 = 4.96 against a base loss of 0.251, so rel_weight 1.0
   # makes it ~20x the rest of the objective.  Useful range is 0.01-0.05
   # (0.02 puts it at roughly 20% of the total).  Do NOT start at 1.0.
   # rel_weight: 0.02

   # ---- see the header for the measurement behind each of these ----------------
   cov_sampling: 250           # integrator chunk; `sampling: 50` still drives the loss
   branches: both              # GRU (short) + Mamba (long), as intended
   mamba_stride: 32            # 21 SSM steps; first plateau 2.88 s meets the
                               # GRU's 2.97 s cutoff -- clean handoff, no gap
   # 60s, NOT 120s.  MEASURED window counts on this split, at the sizes
   # metric_horizons actually forces (window = step = horizon, 0% overlap):
   #     30 s   -> 224 windows / 11 flights
   #     60 s   -> 101 windows / 11 flights   <- selection runs here
   #    120 s   ->  42 windows / 10 flights
   # At 120 s ONE flight carries 11 of the 42 windows (26%), three flights
   # contribute a single window each, and one flight is too short to appear at all.
   # That is the RMS-pooling trap this corpus has already sprung once.  60 s has
   # 2.4x the windows, every flight present, and a larger share of error the model
   # can actually move (15.1% vs 5.8% -- the rest is attitude, and correct_gyro is
   # False).  pos_error_120s is still REPORTED every epoch; it just does not pick
   # the checkpoint.
   # ---- AIRSPEED CONSISTENCY IN THE LOSS (2026-09-07) -------------------------
   # Airspeed was already a network INPUT, but an input constrains nothing: the
   # objective only ever compared the prediction to GT velocity, so nothing stopped
   # the model doing the one thing it is structurally tempted to do.
   #
   # THE TEMPTATION.  A tilt error and an accel bias are the same thing to a velocity
   # objective: a tilt theta leaks g*sin(theta) into the horizontal.  MEASURED: the
   # 0.0663 m/s^2 bias the 15 s freeze fits IS a 0.387 deg tilt.  With correct_gyro
   # False the network can only move accel, so the cheapest way to cut velocity error
   # is to cancel attitude drift with a fake accel bias -- HIDING the gyro error.
   #
   # MEASURED that this term resists it.  Inject a real 0.10 deg/s gyro bias, then
   # let a fake accel bias hide it:
   #     fake accel   GT vel err @40s   air |resid|
   #      (clean)         12.14 m/s       1.285 m/s
   #       0.00           18.58           2.785
   #      -0.40           13.01           1.529     <- best hiding
   # The hiding removes 86% of the velocity damage and leaves the airspeed residual
   # 19% high, because a gyro bias makes velocity error grow QUADRATICALLY (attitude
   # drifts, so the gravity leak grows) while a constant accel bias is LINEAR.  A
   # constant cannot match a quadratic's shape, and this term scores every frame.
   #
   # SENSITIVITY: the residual reacts 2-5x harder than the GT velocity term to both
   # fault types (gyro 0.01 deg/s -> air +11.0% vs velocity +2.6%).
   #
   # WEIGHT.  air_loss is 0.8735 at init against a total objective of 0.2435, so
   # air_weight 0.09 puts this term at ~25% of the objective -- enough to bind,
   # not enough to swamp the velocity term.  Recompute if the other weights change:
   #     air_weight = share/(1-share) * total_loss / air_loss
   # SET air_weight: 0.0 TO TURN IT OFF; the loss is then bit-for-bit as before.
   # 0.0 with gtrot True -- see the attitude block above.  The term's whole job was
   # to stop the accel correction cancelling gyro drift; with attitude supplied
   # externally that failure mode is gone, and the term would only be adding its own
   # wind-model error (fitted wind ran 9.6-19.7 m/s against a real crab of ~5.4).
   # Set back to 0.09 ONLY if you return to gtrot: False.
   air_weight: 0.0
   airspeed_scale: 0.993       # pitot scale MEASURED against GPS on this aircraft
   air_wind_ridge: 1e-2        # ridge on the per-window wind fit.  NOT cosmetic: in
                               # straight flight every design-matrix row points the
                               # same way, the normal matrix collapses to rank 1, and
                               # an unregularised crosswind estimate would absorb the
                               # very error this term exists to expose.
   air_huber_delta: 1.0        # m/s.  Mean residual is 1.285 m/s and the GT-velocity
                               # floor is 0.572 m/s (unmodelled sideslip), so this
                               # knee sits just above the floor.

   select_metric: pos_error_60s
   # OFF: airspeed is not an encoder input.  in_dim is 6 (3 acc + 3 gyro).
   # airspeed_mean / airspeed_std below are INERT while this is False -- they are the
   # normalisation constants for the channel and are kept so re-enabling is one token.
   use_airspeed: False
   airspeed_mean: 22.4659      # TRAIN-SPLIT statistics only (57 flights, 3,380,162 frames)
   airspeed_std: 2.9918

}
