# tilt_rotate -- tilt_aware with the attitude error given its RIGHT FUNCTIONAL FORM
#
# WHAT tilt_aware SHOWED (logs/, 1122 epochs, seed 0).  It is the first arm on this
# corpus whose validation error keeps improving with training (best epochs 120-932,
# not 1-4): val model/raw at 30/60/120 s went 0.978/0.965/0.949 -> 0.959/0.929/0.871.
# The gravity input is doing something.  Held-out (`--splits inference`) is not yet
# scored, so this is NOT a pass -- see logs/analysis/ANALYSIS.md.
#
# WHAT THIS ARM CHANGES, AND WHY.
#
#   correction_mode: rotate    corrected_acc = Exp(dtheta) @ raw + b.  The quantity
#                        being removed is attitude leakage (the fitted "bias" doubles
#                        from the 30 s to the 120 s fit).  If the attitude handed to the
#                        integrator is off by dtheta, rotating the specific force by
#                        dtheta cancels it EXACTLY; an additive head can only
#                        approximate g*(dtheta x g_body) and has to learn the g_body
#                        dependence from ~440 distinct windows.  dtheta is bounded to
#                        rotate_max_deg by a tanh and zero at init (identity at step 0).
#                        The additive b is kept for a genuine accelerometer bias.
#
#   cov_stop_grad: True  The covariance NLL no longer back-propagates into the shared
#                        trunk.  On tilt_aware it was ~32% of val_loss, bottomed at
#                        epoch 42 and then drifted up while the correction kept
#                        improving -- two objectives pulling one trunk.
#
#   cov_model / cov_bias_std_init / cov_calib_lr_mult REMOVED.  No code in this repo
#                        reads them: tilt_aware already ran with the plain propagated
#                        covariance.  HybridNet now warns if they are set.
#
#   max_epoches 4000 -> 300, patience 60 -> 20.  tilt_aware reached the LR floor at
#                        epoch 309; 30/60 s were flat from there, and 800 more epochs
#                        moved 120 s by ~0.01.
#
# NOTE ON METRICS.  train.py now logs true per-window means (it used to log train_*
# as a SUM over batches and val_* x batch_size: x6 at 30/60 s, x3 at 120 s).  Compare
# against tilt_aware by the model/raw RATIO only, never by absolute metres.
#
# AVAILABLE, OFF HERE to keep this a two-change arm:
#   causal_cnn: True        removes 120 ms of future-IMU lookahead from the CNN.  Turn
#                           on for anything meant to run in real time.
#   loss_time_power: 1.0    weights late checkpoints more (end-point horizons).
#
# PASS BAR (unchanged, pre-registered in tilt_aware.conf): on --splits inference
# --per_flight, pooled 120 s < 0.9585, LOFO range entirely < 1.0 at 120 s, and the
# best epoch not before 5.  Must also beat tilt_aware itself on the same split.

general:
{
   exp_dir: experiments/UAV
}

dataset:
{
   include "../../datasets/UAV/uav_6000train_4000eval.conf"
   collate: padding9
   train: { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   eval:  { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   test:  { freeze_hist_s: 15.0, freeze_k_sub: 10 }
   # float32 or --splits inference (the only held-out flights) cannot run at all
   inference: { freeze_hist_s: 15.0, freeze_k_sub: 10, dtype: float32 }
}

train:
{
   include "../../train/train.conf"

   # ---- identical to accel_const ---------------------------------------------
   lr: 1e-3
   batch_size: 6
   factor: 0.3
   min_lr: 1e-5
   save_freq: 1
   pos_weight: 4.9
   vel_weight: 17.2
   cov_weight: 1e-4
   decouple_cov: True
   use_pos_loss: False
   use_rot_loss: False
   rot_cov_weight: 0.0
   pos_cov_weight: 5.5e-3
   vel_cov_weight: 1.4e-3
   network: hybridnet
   gtrot: True
   propcov: True
   covaug: False
   normalize_input: True
   correct_gyro: False
   use_airspeed: False
   air_weight: 0.00
   aug_acc_bias_std: [0.00798, 0.00986, 0.00164]
   aug_gyro_bias_std: [0.0002, 0.0002, 0.0002]
   ema_decay: 0.982
   select_smooth: 3
   eval_batch_size: 64
   metric_horizons: [6000, 3000, 12000]
   select_metric: pos_error_60s
   eval_freq: 10
   sampling: 50
   cov_sampling: 250
   loss: Huber_loss005
   pos_huber_delta: 0.6
   vel_huber_delta: 0.27
   gru_window: 300
   mamba_stride: 32
   fuse: concat
   gru_hidden: 64
   mamba_dim: 32
   mamba_layers: 1
   head_hidden: 32
   cnn_dim: 32

   # ---- THE CHANGE -----------------------------------------------------------
   att_input: gravity          # in_dim 6 -> 9; [gx, gy, gz] in body frame
   # NavEul (GPSNavEulX/Y/Z), NOT EulX/Y/Z.  `att_source: mti` reads _MTI_COLS =
   # ["EulX","EulY","EulZ"]; `gt` reads GPSNavEulX/Y/Z, the same nav attitude the
   # integrator uses under gtrot: True.  Feeding it is still NEW information to the
   # network -- it currently sees only acc and gyro, so it cannot compare the
   # measured specific force against the expected gravity direction.  The MTi
   # variant was tried first for its independence, but MTi tilt has been measured
   # to HURT 4/11 test flights when used to aid, and NavEul is the validated
   # attitude on this project.  Switch to mti only as a deliberate second arm.
   att_source: gt
   const_correction: False     # a constant is the wrong form; see the header

   # ---- THIS ARM -------------------------------------------------------------
   correction_mode: rotate     # was `additive` in tilt_aware; see the header
   rotate_max_deg: 2.0         # ~5x the 0.387 deg tilt the fitted bias corresponds to
   cov_stop_grad: True
   causal_cnn: False
   loss_time_power: 0.0

   # ---- BUDGET ---------------------------------------------------------------
   max_epoches: 300
   patience: 20

   # Runs before 2026-09-08 were UNSEEDED, so no previous arm-to-arm comparison
   # controlled for the seed.  Pinned here so this one is reproducible and so a
   # rerun measures the change, not a new random draw.
   seed: 0
}
