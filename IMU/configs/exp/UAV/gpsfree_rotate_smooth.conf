# gpsfree_rotate_smooth -- tilt_rotate_smooth with NO GPS-AIDED INPUT AT ALL.
#
# FOR A DRONE THAT FLIES WITHOUT GPS FROM TAKE-OFF.  The earlier arms used GPS in
# three places a GPS-free drone does not have.  All three are switched here:
#
#   1. att_source: mti    the network's gravity input (g_body) comes from the MTi
#                         AHRS attitude (EulX/Y/Z), not GPSNavEul.
#   2. rot_source: mti    the integrator removes gravity with the MTi attitude, not
#                         GPSNavEul.  (Only the TILT matters there: R^T [0,0,g] does
#                         not depend on heading, so the MTi's drifting heading does
#                         not enter.)
#   3. freeze_hist_s: 0   no 15 s bias freeze -- it was fitted against GPS velocity.
#
# What still comes from GPS, and why that is fine:
#   - the LABELS (true velocity / position).  Needed for training only, never on the
#     drone.
#   - the START STATE of each window (position, velocity, attitude).  On the drone it
#     comes from the EKF (land matching, VO); the IMU model's job is to bridge the gap
#     between fixes.  The EKF test (EKF/run_stream.py --no_gt) has no GPS at all.
#
# NOT comparable with tilt_rotate by absolute numbers OR by model/raw ratio: the raw
# baseline also changes (MTi attitude, no freeze).  Compare against the raw arm of
# THIS run, and on the held-out flights.
#
# The MTi tilt is ~1.4 deg (roll) / ~1.8 deg (pitch) RMS off the nav solution on this
# corpus, larger than the ~0.4 deg tilt error the GPS-aided arms corrected; the rotate
# head allows up to rotate_max_deg = 2.0.  If dtheta sits at that limit, raise it.

include "tilt_rotate_smooth.conf"

dataset:
{
   train:     { freeze_hist_s: 0.0 }
   eval:      { freeze_hist_s: 0.0 }
   test:      { freeze_hist_s: 0.0 }
   inference: { freeze_hist_s: 0.0 }
}

train:
{
   att_source: mti
   rot_source: mti
}
