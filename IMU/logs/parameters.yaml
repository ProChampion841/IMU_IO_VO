train: 
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 6
  min_lr: 1e-05
  max_epoches: 4000
  patience: 60
  factor: 0.3
  save_freq: 1
  eval_freq: 10
  cov_weight: 0.0001
  sampling: 50
  gtinit: true
  pos_weight: 4.9
  vel_weight: 17.2
  decouple_cov: true
  use_pos_loss: false
  use_rot_loss: false
  rot_cov_weight: 0.0
  pos_cov_weight: 0.0055
  vel_cov_weight: 0.0014
  network: hybridnet
  gtrot: true
  propcov: true
  covaug: false
  normalize_input: true
  correct_gyro: false
  use_airspeed: false
  air_weight: 0.0
  aug_acc_bias_std: 
    - 0.00798
    - 0.00986
    - 0.00164
  aug_gyro_bias_std: 
    - 0.0002
    - 0.0002
    - 0.0002
  ema_decay: 0.982
  select_smooth: 3
  eval_batch_size: 64
  metric_horizons: 
    - 6000
    - 3000
    - 12000
  select_metric: pos_error_60s
  cov_sampling: 250
  loss: Huber_loss005
  pos_huber_delta: 0.6
  vel_huber_delta: 0.27
  gru_window: 300
  mamba_stride: 32
  fuse: concat
  correction_mode: additive
  gru_hidden: 64
  mamba_dim: 32
  mamba_layers: 1
  head_hidden: 32
  cnn_dim: 32
  att_input: gravity
  att_source: gt
  const_correction: false
  cov_model: bias
  cov_bias_std_init: 
    - 0.066
    - 0.066
    - 0.021
  cov_calib_lr_mult: 30
  seed: 0